<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Wild Bunch immutable-history replay proof</title>
  <desc id="desc">Six immutable ordered events continually refresh a replaceable Cache. A separate full-history spine feeds Replay, which rebuilds that same Cache. Cache alone produces the current State, whose right edge progressively loses information.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker>
    <pattern id="warm-grain" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r="1.2" fill="#fff" opacity=".13"/><circle cx="14" cy="12" r="1" fill="#2b1b10" opacity=".12"/><path d="M0 17L19 13" stroke="#fff" stroke-width=".7" opacity=".08"/></pattern>
    <pattern id="dark-grain" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="4" cy="6" r="1" fill="#fff" opacity=".08"/><circle cx="13" cy="14" r="1.2" fill="#000" opacity=".15"/></pattern>
    <linearGradient id="state-fill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#756a5e"/><stop offset=".58" stop-color="#91877c"/><stop offset="1" stop-color="#d9dcda"/></linearGradient>
    <linearGradient id="state-mask-gradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="white"/><stop offset=".62" stop-color="white"/><stop offset=".82" stop-color="#aaa"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="state-mask"><rect width="420" height="680" fill="url(#state-mask-gradient)"/><g fill="black" opacity=".9"><circle cx="326" cy="44" r="13"/><circle cx="360" cy="78" r="8"/><circle cx="388" cy="112" r="17"/><circle cx="342" cy="146" r="7"/><circle cx="401" cy="181" r="11"/><circle cx="370" cy="218" r="19"/><circle cx="326" cy="255" r="9"/><circle cx="397" cy="294" r="14"/><circle cx="350" cy="337" r="21"/><circle cx="388" cy="376" r="8"/><circle cx="332" cy="418" r="15"/><circle cx="405" cy="463" r="19"/><circle cx="359" cy="506" r="10"/><circle cx="391" cy="548" r="16"/><circle cx="337" cy="594" r="8"/><circle cx="402" cy="632" r="20"/></g></mask>
  </defs>
  <rect width="1600" height="1000" fill="#e6eaeb"/>
  <g font-family="'Source Code Pro',Consolas,monospace" fill="#172127">
    <text x="228" y="70" font-size="23" font-weight="700" letter-spacing="1.2">IMMUTABLE EVENT HISTORY</text><text x="676" y="70" font-size="20" fill="#56636b">DERIVATION MECHANISMS</text><text x="1060" y="70" font-size="20" fill="#56636b">DERIVED PRESENT</text>
    <path id="full-history-to-replay" d="M120 124V820Q120 866 166 866H610Q640 866 640 836V689H660" fill="none" stroke="#292d2d" stroke-width="7" marker-end="url(#arrow)"/><text x="82" y="854" font-size="14" fill="#6f4b2e" transform="rotate(-90 82 854)">READ THE COMPLETE ORDERED RECORD</text>
    <g stroke="#5d3d24" stroke-width="3" fill="none"><path d="M228 143H122" marker-end="url(#arrow)"/><path d="M228 253H122" marker-end="url(#arrow)"/><path d="M228 363H122" marker-end="url(#arrow)"/><path d="M228 473H122" marker-end="url(#arrow)"/><path d="M228 583H122" marker-end="url(#arrow)"/><path d="M228 693H122" marker-end="url(#arrow)"/></g>
    <g>
      <g transform="translate(228 105)"><rect width="312" height="76" fill="#a87243" stroke="#5d3d24" stroke-width="3"/><rect width="312" height="76" fill="url(#warm-grain)"/><text x="18" y="31" fill="#f7efe4" font-size="21" font-weight="700">EVENT 01 · TIMESTAMP</text><text x="18" y="58" fill="#f7efe4" font-size="17">GameStarted</text></g>
      <g transform="translate(228 215)"><rect width="312" height="76" fill="#9e693d" stroke="#5d3d24" stroke-width="3"/><rect width="312" height="76" fill="url(#warm-grain)"/><text x="18" y="31" fill="#f7efe4" font-size="21" font-weight="700">EVENT 02 · TIMESTAMP</text><text x="18" y="58" fill="#f7efe4" font-size="17">StoreItemPurchased</text></g>
      <g transform="translate(228 325)"><rect width="312" height="76" fill="#ad7547" stroke="#5d3d24" stroke-width="3"/><rect width="312" height="76" fill="url(#warm-grain)"/><text x="18" y="31" fill="#f7efe4" font-size="21" font-weight="700">EVENT 03 · TIMESTAMP</text><text x="18" y="58" fill="#f7efe4" font-size="17">JourneyStarted</text></g>
      <g transform="translate(228 435)"><rect width="312" height="76" fill="#986339" stroke="#5d3d24" stroke-width="3"/><rect width="312" height="76" fill="url(#warm-grain)"/><text x="18" y="31" fill="#f7efe4" font-size="21" font-weight="700">EVENT 04 · TIMESTAMP</text><text x="18" y="58" fill="#f7efe4" font-size="17">TravelDayAdvanced</text></g>
      <g transform="translate(228 545)"><rect width="312" height="76" fill="#aa7142" stroke="#5d3d24" stroke-width="3"/><rect width="312" height="76" fill="url(#warm-grain)"/><text x="18" y="31" fill="#f7efe4" font-size="21" font-weight="700">EVENT 05 · TIMESTAMP</text><text x="18" y="58" fill="#f7efe4" font-size="17">JourneyCompleted</text></g>
      <g transform="translate(228 655)"><rect width="312" height="76" fill="#956039" stroke="#5d3d24" stroke-width="3"/><rect width="312" height="76" fill="url(#warm-grain)"/><text x="18" y="31" fill="#f7efe4" font-size="21" font-weight="700">EVENT 06 · TIMESTAMP</text><text x="18" y="58" fill="#f7efe4" font-size="17">JourneyArrivalAcknowledged</text></g>
    </g>
    <g id="events-to-cache" fill="none" stroke="#765432" stroke-width="3"><path d="M540 143C594 143 600 226 660 226" marker-end="url(#arrow)"/><path d="M540 253C590 253 608 248 660 248" marker-end="url(#arrow)"/><path d="M540 363C594 363 606 270 660 270" marker-end="url(#arrow)"/><path d="M540 473C592 473 610 292 660 292" marker-end="url(#arrow)"/><path d="M540 583C600 583 612 314 660 314" marker-end="url(#arrow)"/><path d="M540 693C604 693 614 336 660 336" marker-end="url(#arrow)"/></g><text x="556" y="119" font-size="15" fill="#765432">LIVE REFRESH</text>
    <g transform="translate(660 170)"><rect width="278" height="258" fill="#c8c2b8" stroke="#4e4b46" stroke-width="4"/><rect width="278" height="258" fill="url(#warm-grain)"/><text x="139" y="112" text-anchor="middle" font-size="34" font-weight="700">Cache</text><text x="139" y="151" text-anchor="middle" font-size="19" fill="#4f5556">continually refreshed</text><text x="139" y="194" text-anchor="middle" font-size="16" fill="#4f5556">derived · replaceable</text></g>
    <g transform="translate(660 560)"><rect width="278" height="258" fill="#343738" stroke="#171b1c" stroke-width="4"/><rect width="278" height="258" fill="url(#dark-grain)"/><text x="139" y="112" text-anchor="middle" font-size="34" font-weight="700" fill="#f0ece4">Replay</text><text x="139" y="151" text-anchor="middle" font-size="19" fill="#d0ccc4">full-history walk</text><text x="139" y="194" text-anchor="middle" font-size="16" fill="#d0ccc4">rebuild from truth</text></g>
    <path id="replay-to-cache" d="M938 689H978V474Q978 448 952 448H799V428" fill="none" stroke="#292d2d" stroke-width="5" marker-end="url(#arrow)"/><text x="822" y="475" font-size="16" fill="#292d2d">REBUILD CACHE</text><path id="cache-to-state" d="M938 299H1040" fill="none" stroke="#4e4b46" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(1040 150)" mask="url(#state-mask)"><rect width="420" height="680" fill="url(#state-fill)" stroke="#3c403f" stroke-width="6"/><rect width="420" height="680" fill="url(#dark-grain)" opacity=".6"/><text x="44" y="82" fill="#f4f1ea" font-size="34" font-weight="700">State</text><text x="44" y="119" fill="#ede8df" font-size="19">from derived cache</text><circle cx="176" cy="288" r="92" fill="none" stroke="#eee8dc" stroke-width="5" opacity=".78"/><path d="M44 288H84M268 288H332M176 156V196M176 380V420" stroke="#eee8dc" stroke-width="5" opacity=".78"/><path d="M112 288H240M176 224V352" stroke="#eee8dc" stroke-width="3" opacity=".65"/><text x="44" y="540" fill="#f4f1ea" font-size="19">TravelDiaryDays.Count</text><text x="44" y="576" fill="#f4f1ea" font-size="25" font-weight="700">CURRENT VIEW</text><text x="44" y="630" fill="#e4ded4" font-size="17">perishable present</text></g>
    <text x="228" y="930" font-size="19" fill="#6f4b2e">ONE CANONICAL HISTORY</text><text x="660" y="930" font-size="19" fill="#56636b">REPLAY REBUILDS CACHE</text><text x="1040" y="930" font-size="19" fill="#56636b">CACHE PRODUCES STATE</text>
  </g>
</svg>
