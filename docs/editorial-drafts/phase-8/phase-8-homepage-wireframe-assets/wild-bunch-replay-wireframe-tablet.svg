<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Wild Bunch tablet replay proof</title>
  <desc id="desc">A tablet-authored horizontal proof: six immutable events refresh Cache while a full-history spine feeds Replay. Replay rebuilds Cache, and Cache alone produces the right-fading State.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker>
    <pattern id="warm-grain" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r="1" fill="#fff" opacity=".13"/><circle cx="13" cy="12" r="1" fill="#2b1b10" opacity=".12"/></pattern>
    <pattern id="dark-grain" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="4" cy="6" r="1" fill="#fff" opacity=".08"/><circle cx="13" cy="14" r="1.2" fill="#000" opacity=".15"/></pattern>
    <linearGradient id="state-fill" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#756a5e"/><stop offset=".58" stop-color="#91877c"/><stop offset="1" stop-color="#d9dcda"/></linearGradient>
    <linearGradient id="state-mask-gradient" x1="0" y1="0" x2="1" y2="0"><stop stop-color="white"/><stop offset=".62" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="state-mask"><rect width="330" height="560" fill="url(#state-mask-gradient)"/><g fill="black"><circle cx="246" cy="44" r="10"/><circle cx="278" cy="88" r="16"/><circle cx="252" cy="138" r="7"/><circle cx="298" cy="190" r="17"/><circle cx="262" cy="246" r="11"/><circle cx="304" cy="310" r="19"/><circle cx="272" cy="378" r="9"/><circle cx="308" cy="448" r="18"/></g></mask>
  </defs>
  <rect width="1200" height="800" fill="#e6eaeb"/>
  <g font-family="'Source Code Pro',Consolas,monospace" fill="#172127">
    <text x="110" y="48" font-size="20" font-weight="700">IMMUTABLE EVENT HISTORY</text><text x="470" y="48" font-size="17" fill="#56636b">DERIVATION</text><text x="820" y="48" font-size="17" fill="#56636b">DERIVED PRESENT</text>
    <path id="full-history-to-replay" d="M44 94V556Q44 590 78 590H438Q454 590 454 574V545H470" fill="none" stroke="#292d2d" stroke-width="6" marker-end="url(#arrow)"/><text x="22" y="554" font-size="12" fill="#6f4b2e" transform="rotate(-90 22 554)">COMPLETE HISTORY</text>
    <g stroke="#5d3d24" stroke-width="3" fill="none"><path d="M110 116H46" marker-end="url(#arrow)"/><path d="M110 188H46" marker-end="url(#arrow)"/><path d="M110 260H46" marker-end="url(#arrow)"/><path d="M110 332H46" marker-end="url(#arrow)"/><path d="M110 404H46" marker-end="url(#arrow)"/><path d="M110 476H46" marker-end="url(#arrow)"/></g>
    <g>
      <g transform="translate(110 86)"><rect width="300" height="60" fill="#a87243" stroke="#5d3d24" stroke-width="3"/><rect width="300" height="60" fill="url(#warm-grain)"/><text x="14" y="25" fill="#f7efe4" font-size="18" font-weight="700">EVENT 01 · TIMESTAMP</text><text x="14" y="48" fill="#f7efe4" font-size="15">GameStarted</text></g>
      <g transform="translate(110 158)"><rect width="300" height="60" fill="#9e693d" stroke="#5d3d24" stroke-width="3"/><rect width="300" height="60" fill="url(#warm-grain)"/><text x="14" y="25" fill="#f7efe4" font-size="18" font-weight="700">EVENT 02 · TIMESTAMP</text><text x="14" y="48" fill="#f7efe4" font-size="15">StoreItemPurchased</text></g>
      <g transform="translate(110 230)"><rect width="300" height="60" fill="#ad7547" stroke="#5d3d24" stroke-width="3"/><rect width="300" height="60" fill="url(#warm-grain)"/><text x="14" y="25" fill="#f7efe4" font-size="18" font-weight="700">EVENT 03 · TIMESTAMP</text><text x="14" y="48" fill="#f7efe4" font-size="15">JourneyStarted</text></g>
      <g transform="translate(110 302)"><rect width="300" height="60" fill="#986339" stroke="#5d3d24" stroke-width="3"/><rect width="300" height="60" fill="url(#warm-grain)"/><text x="14" y="25" fill="#f7efe4" font-size="18" font-weight="700">EVENT 04 · TIMESTAMP</text><text x="14" y="48" fill="#f7efe4" font-size="15">TravelDayAdvanced</text></g>
      <g transform="translate(110 374)"><rect width="300" height="60" fill="#aa7142" stroke="#5d3d24" stroke-width="3"/><rect width="300" height="60" fill="url(#warm-grain)"/><text x="14" y="25" fill="#f7efe4" font-size="18" font-weight="700">EVENT 05 · TIMESTAMP</text><text x="14" y="48" fill="#f7efe4" font-size="15">JourneyCompleted</text></g>
      <g transform="translate(110 446)"><rect width="300" height="60" fill="#956039" stroke="#5d3d24" stroke-width="3"/><rect width="300" height="60" fill="url(#warm-grain)"/><text x="14" y="25" fill="#f7efe4" font-size="18" font-weight="700">EVENT 06 · TIMESTAMP</text><text x="14" y="48" fill="#f7efe4" font-size="15">JourneyArrivalAcknowledged</text></g>
    </g>
    <g id="events-to-cache" fill="none" stroke="#765432" stroke-width="3"><path d="M410 116C438 116 442 176 470 176" marker-end="url(#arrow)"/><path d="M410 188C440 188 444 198 470 198" marker-end="url(#arrow)"/><path d="M410 260C440 260 444 220 470 220" marker-end="url(#arrow)"/><path d="M410 332C440 332 444 242 470 242" marker-end="url(#arrow)"/><path d="M410 404C440 404 444 264 470 264" marker-end="url(#arrow)"/><path d="M410 476C440 476 444 286 470 286" marker-end="url(#arrow)"/></g><text x="416" y="92" font-size="13" fill="#765432">LIVE REFRESH</text>
    <g transform="translate(470 120)"><rect width="250" height="210" fill="#c8c2b8" stroke="#4e4b46" stroke-width="4"/><rect width="250" height="210" fill="url(#warm-grain)"/><text x="125" y="88" text-anchor="middle" font-size="30" font-weight="700">Cache</text><text x="125" y="124" text-anchor="middle" font-size="17" fill="#4f5556">continually refreshed</text><text x="125" y="160" text-anchor="middle" font-size="14" fill="#4f5556">derived · replaceable</text></g>
    <g transform="translate(470 440)"><rect width="250" height="210" fill="#343738" stroke="#171b1c" stroke-width="4"/><rect width="250" height="210" fill="url(#dark-grain)"/><text x="125" y="88" text-anchor="middle" font-size="30" font-weight="700" fill="#f0ece4">Replay</text><text x="125" y="124" text-anchor="middle" font-size="17" fill="#d0ccc4">full-history walk</text><text x="125" y="160" text-anchor="middle" font-size="14" fill="#d0ccc4">rebuild from truth</text></g>
    <path id="replay-to-cache" d="M720 545H766V370Q766 350 746 350H595V330" fill="none" stroke="#292d2d" stroke-width="5" marker-end="url(#arrow)"/><text x="622" y="378" font-size="14">REBUILD CACHE</text><path id="cache-to-state" d="M720 225H820" fill="none" stroke="#4e4b46" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(820 90)" mask="url(#state-mask)"><rect width="330" height="560" fill="url(#state-fill)" stroke="#3c403f" stroke-width="5"/><rect width="330" height="560" fill="url(#dark-grain)" opacity=".55"/><text x="34" y="66" fill="#f4f1ea" font-size="30" font-weight="700">State</text><text x="34" y="100" fill="#ede8df" font-size="17">from derived cache</text><circle cx="140" cy="260" r="70" fill="none" stroke="#eee8dc" stroke-width="4" opacity=".78"/><path d="M34 260H70M210 260H264M140 154V190M140 330V366" stroke="#eee8dc" stroke-width="4" opacity=".78"/><path d="M70 260H210M140 190V330" stroke="#eee8dc" stroke-width="3" opacity=".65"/><text x="34" y="456" fill="#f4f1ea" font-size="17">TravelDiaryDays.Count</text><text x="34" y="490" fill="#f4f1ea" font-size="22" font-weight="700">CURRENT VIEW</text></g>
    <text x="110" y="730" font-size="16" fill="#6f4b2e">ONE CANONICAL HISTORY</text><text x="470" y="730" font-size="16" fill="#56636b">REPLAY REBUILDS CACHE</text><text x="820" y="730" font-size="16" fill="#56636b">CACHE PRODUCES STATE</text>
  </g>
</svg>
