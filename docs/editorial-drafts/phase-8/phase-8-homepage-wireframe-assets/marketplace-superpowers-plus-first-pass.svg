<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Superpowers Plus lineage and Handoff Gates evidence composition</title>
  <desc id="desc">An inherited obra Superpowers source record branches into Harley's maintained Superpowers Plus derivative, with Handoff Gates shown as the dominant readiness boundary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d2b30"/>
    </marker>
    <style>
      .sans { font-family: "Source Sans 3", "Segoe UI", sans-serif; fill: #172127; }
      .mono { font-family: "Source Code Pro", Consolas, monospace; fill: #172127; }
      .small { font-size: 23px; }
      .meta { font-size: 20px; font-weight: 600; }
      .body { font-size: 28px; }
      .head { font-size: 58px; font-weight: 650; letter-spacing: -1.5px; }
      .white { fill: #f5f7f6; }
      .soft { fill: #b8c2ad; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#e6eaeb"/>
  <path d="M0 62 H1600" stroke="#172127" stroke-width="2"/>
  <text x="70" y="42" class="sans meta">Source lineage · inspected at agent-asset-marketplace 5974690</text>

  <g aria-label="Upstream source record">
    <rect x="70" y="122" width="470" height="768" fill="#f5f7f6" stroke="#172127" stroke-width="3"/>
    <rect x="70" y="122" width="14" height="768" fill="#7a8791"/>
    <text x="116" y="182" class="sans meta">Inherited base</text>
    <text x="116" y="256" class="sans head">obra/</text>
    <text x="116" y="318" class="sans head">superpowers</text>
    <text x="116" y="370" class="sans body">v6.2.0 · MIT</text>
    <path d="M116 410 H488" stroke="#172127" stroke-width="2"/>
    <text x="116" y="460" class="sans body">A strong upstream</text>
    <text x="116" y="498" class="sans body">workflow system.</text>
    <text x="116" y="572" class="mono small">brainstorming</text>
    <text x="116" y="614" class="mono small">writing-plans</text>
    <text x="116" y="656" class="mono small">executing-plans</text>
    <text x="116" y="698" class="mono small">verification-before-completion</text>
    <text x="116" y="820" class="sans small">Upstream attribution remains visible.</text>
    <text x="116" y="850" class="sans small">The inherited lifecycle is not Harley's invention.</text>
  </g>

  <path d="M540 510 C640 510 675 430 760 430" fill="none" stroke="#1d2b30" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="588" y="472" class="sans meta">used seriously</text>
  <text x="595" y="506" class="sans meta">then changed</text>

  <g aria-label="Maintained derivative and Handoff Gates">
    <rect x="760" y="122" width="770" height="768" fill="#1d2b30"/>
    <rect x="760" y="122" width="770" height="98" fill="#b8c2ad"/>
    <text x="805" y="183" class="sans head" style="font-size:47px">Superpowers+</text>
    <text x="1215" y="181" class="sans meta">maintained derivative</text>

    <text x="805" y="288" class="sans meta white">Dominant first-party modification</text>
    <text x="805" y="365" class="sans head white">Handoff Gates</text>
    <path d="M805 402 H1477" stroke="#f5f7f6" stroke-width="2"/>
    <text x="805" y="466" class="mono body white">Never hand off below 8/10.</text>
    <text x="805" y="510" class="mono body soft">Target 9/10+.</text>

    <g transform="translate(805 570)">
      <rect width="202" height="164" fill="#f5f7f6"/>
      <text x="22" y="42" class="sans meta">Spec readiness</text>
      <text x="22" y="84" class="sans small">Can planning</text>
      <text x="22" y="116" class="sans small">continue without</text>
      <text x="22" y="148" class="sans small">improvising?</text>
    </g>
    <g transform="translate(1031 570)">
      <rect width="202" height="164" fill="#f5f7f6"/>
      <text x="22" y="42" class="sans meta">Plan readiness</text>
      <text x="22" y="84" class="sans small">Can the work</text>
      <text x="22" y="116" class="sans small">execute without</text>
      <text x="22" y="148" class="sans small">rediscovery?</text>
    </g>
    <g transform="translate(1257 570)">
      <rect width="220" height="164" fill="#f5f7f6"/>
      <text x="22" y="42" class="sans meta">Completion readiness</text>
      <text x="22" y="84" class="sans small">What will review</text>
      <text x="22" y="116" class="sans small">find against the</text>
      <text x="22" y="148" class="sans small">actual contract?</text>
    </g>

    <text x="805" y="796" class="sans small white">The producer's “done” is not the boundary.</text>
    <text x="805" y="832" class="sans small white">The next worker's ability to continue is.</text>
  </g>

  <text x="70" y="954" class="sans small">Source custody: obra/superpowers v6.2.0 MIT provenance · Superpowers+ and Handoff Gates from HarleyBartles/agent-asset-marketplace</text>
</svg>
