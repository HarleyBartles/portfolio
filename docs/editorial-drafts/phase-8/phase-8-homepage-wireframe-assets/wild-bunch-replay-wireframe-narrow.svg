<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">Wild Bunch exact replay proof</title>
  <desc id="desc">A compact canonical event history branches through a direct snapshot shortcut and a longer full replay route before both reach the same live state.</desc>
  <defs><linearGradient id="tintype" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7c7ad"/><stop offset=".52" stop-color="#af875f"/><stop offset="1" stop-color="#364348"/></linearGradient></defs>
  <rect width="720" height="980" fill="#e6eaeb"/>
  <g font-family="Consolas,monospace" fill="#172127">
    <text x="48" y="62" font-size="20" font-weight="700">CANONICAL EVENT HISTORY</text>
    <line x1="58" y1="102" x2="58" y2="420" stroke="#a87442" stroke-width="5"/>
    <g font-size="17">
      <g transform="translate(82 94)"><rect width="360" height="54" fill="#f4f6f6" stroke="#6e777b"/><text x="18" y="34">GameStarted</text></g>
      <g transform="translate(82 162)"><rect width="360" height="54" fill="#f4f6f6" stroke="#6e777b"/><text x="18" y="34">StoreItemPurchased</text></g>
      <g transform="translate(82 230)"><rect width="360" height="54" fill="#f4f6f6" stroke="#6e777b"/><text x="18" y="34">JourneyStarted</text></g>
      <g transform="translate(82 298)"><rect width="360" height="54" fill="#f4f6f6" stroke="#6e777b"/><text x="18" y="34">TravelDayAdvanced</text></g>
      <g transform="translate(82 366)"><rect width="360" height="54" fill="#f4f6f6" stroke="#6e777b"/><text x="18" y="34">JourneyCompleted</text></g>
    </g>
    <path d="M442 188H584V470H520" fill="none" stroke="#172127" stroke-width="4"/>
    <rect x="458" y="224" width="220" height="94" fill="#f4f6f6" stroke="#172127" stroke-width="3"/><text x="568" y="264" font-size="17" text-anchor="middle">SNAPSHOT</text><text x="568" y="291" font-size="14" text-anchor="middle" fill="#56636b">shortcut</text>
    <path d="M442 393H490V486H148V536H198" fill="none" stroke="#a87442" stroke-width="8"/>
    <text x="48" y="520" font-size="16" fill="#7e532d">FULL REPLAY / REBUILD</text>
    <g transform="translate(48 558)"><rect width="624" height="340" fill="url(#tintype)" stroke="#172127" stroke-width="4"/><text x="28" y="48" fill="#f4f0e6" font-size="18" font-weight="700">SAME LIVE DERIVED STATE</text><circle cx="312" cy="172" r="76" fill="none" stroke="#f4f0e6" stroke-width="5"/><path d="M80 172h156M388 172h156M312 72v24M312 248v24" stroke="#f4f0e6" stroke-width="5"/><text x="28" y="310" fill="#f4f0e6" font-size="15">TravelDiaryDays.Count = EQUAL</text></g>
    <circle cx="520" cy="470" r="9" fill="#172127"/><circle cx="198" cy="536" r="9" fill="#a87442"/>
    <text x="48" y="944" font-size="16" fill="#56636b">ONE HISTORY · TWO MECHANISMS · ONE RESULT</text>
  </g>
</svg>
