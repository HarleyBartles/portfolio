<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1500" role="img" aria-labelledby="title desc">
  <title id="title">Wild Bunch immutable-history replay proof</title>
  <desc id="desc">Six immutable ordered events emit left into a complete-history Replay spine and right into a live Cache-refresh spine. Replay rebuilds Cache, Cache alone produces State, and State progressively dissolves downward.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker>
    <pattern id="warm-grain" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r="1" fill="#fff" opacity=".13"/><circle cx="13" cy="12" r="1" fill="#2b1b10" opacity=".12"/></pattern>
    <pattern id="dark-grain" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="4" cy="6" r="1" fill="#fff" opacity=".08"/><circle cx="13" cy="14" r="1.2" fill="#000" opacity=".15"/></pattern>
    <linearGradient id="state-fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#756a5e"/><stop offset=".58" stop-color="#91877c"/><stop offset="1" stop-color="#d9dcda"/></linearGradient>
    <linearGradient id="state-mask-gradient" x1="0" y1="0" x2="0" y2="1"><stop stop-color="white"/><stop offset=".7" stop-color="white"/><stop offset=".86" stop-color="#aaa"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="state-mask"><rect width="600" height="420" fill="url(#state-mask-gradient)"/><g fill="black"><circle cx="58" cy="315" r="10"/><circle cx="118" cy="348" r="16"/><circle cx="186" cy="326" r="8"/><circle cx="252" cy="370" r="19"/><circle cx="324" cy="338" r="12"/><circle cx="392" cy="382" r="18"/><circle cx="468" cy="346" r="9"/><circle cx="544" cy="390" r="20"/></g></mask>
  </defs>
  <rect width="720" height="1500" fill="#e6eaeb"/>
  <g font-family="'Source Code Pro',Consolas,monospace" fill="#172127">
    <text x="360" y="48" text-anchor="middle" font-size="22" font-weight="700" letter-spacing="1">IMMUTABLE EVENT HISTORY</text><text x="34" y="88" font-size="15" fill="#292d2d">FULL-HISTORY READ</text><text x="536" y="88" font-size="15" fill="#765432">LIVE REFRESH</text>
    <path id="full-history-to-replay" d="M44 126V608Q44 640 76 640H180V680" fill="none" stroke="#292d2d" stroke-width="6" marker-end="url(#arrow)"/><path id="events-to-cache" d="M676 126V608Q676 640 644 640H540V680" fill="none" stroke="#765432" stroke-width="5" marker-end="url(#arrow)"/>
    <g stroke="#5d3d24" stroke-width="3" fill="none"><path d="M104 154H46" marker-end="url(#arrow)"/><path d="M104 232H46" marker-end="url(#arrow)"/><path d="M104 310H46" marker-end="url(#arrow)"/><path d="M104 388H46" marker-end="url(#arrow)"/><path d="M104 466H46" marker-end="url(#arrow)"/><path d="M104 544H46" marker-end="url(#arrow)"/><path d="M616 154H674" marker-end="url(#arrow)"/><path d="M616 232H674" marker-end="url(#arrow)"/><path d="M616 310H674" marker-end="url(#arrow)"/><path d="M616 388H674" marker-end="url(#arrow)"/><path d="M616 466H674" marker-end="url(#arrow)"/><path d="M616 544H674" marker-end="url(#arrow)"/></g>
    <g>
      <g transform="translate(104 122)"><rect width="512" height="64" fill="#a87243" stroke="#5d3d24" stroke-width="3"/><rect width="512" height="64" fill="url(#warm-grain)"/><text x="16" y="27" fill="#f7efe4" font-size="22" font-weight="700">EVENT 01 · TIMESTAMP</text><text x="16" y="52" fill="#f7efe4" font-size="17">GameStarted</text></g>
      <g transform="translate(104 200)"><rect width="512" height="64" fill="#9e693d" stroke="#5d3d24" stroke-width="3"/><rect width="512" height="64" fill="url(#warm-grain)"/><text x="16" y="27" fill="#f7efe4" font-size="22" font-weight="700">EVENT 02 · TIMESTAMP</text><text x="16" y="52" fill="#f7efe4" font-size="17">StoreItemPurchased</text></g>
      <g transform="translate(104 278)"><rect width="512" height="64" fill="#ad7547" stroke="#5d3d24" stroke-width="3"/><rect width="512" height="64" fill="url(#warm-grain)"/><text x="16" y="27" fill="#f7efe4" font-size="22" font-weight="700">EVENT 03 · TIMESTAMP</text><text x="16" y="52" fill="#f7efe4" font-size="17">JourneyStarted</text></g>
      <g transform="translate(104 356)"><rect width="512" height="64" fill="#986339" stroke="#5d3d24" stroke-width="3"/><rect width="512" height="64" fill="url(#warm-grain)"/><text x="16" y="27" fill="#f7efe4" font-size="22" font-weight="700">EVENT 04 · TIMESTAMP</text><text x="16" y="52" fill="#f7efe4" font-size="17">TravelDayAdvanced</text></g>
      <g transform="translate(104 434)"><rect width="512" height="64" fill="#aa7142" stroke="#5d3d24" stroke-width="3"/><rect width="512" height="64" fill="url(#warm-grain)"/><text x="16" y="27" fill="#f7efe4" font-size="22" font-weight="700">EVENT 05 · TIMESTAMP</text><text x="16" y="52" fill="#f7efe4" font-size="17">JourneyCompleted</text></g>
      <g transform="translate(104 512)"><rect width="512" height="64" fill="#956039" stroke="#5d3d24" stroke-width="3"/><rect width="512" height="64" fill="url(#warm-grain)"/><text x="16" y="27" fill="#f7efe4" font-size="22" font-weight="700">EVENT 06 · TIMESTAMP</text><text x="16" y="52" fill="#f7efe4" font-size="17">JourneyArrivalAcknowledged</text></g>
    </g>
    <g transform="translate(40 680)"><rect width="280" height="190" fill="#343738" stroke="#171b1c" stroke-width="4"/><rect width="280" height="190" fill="url(#dark-grain)"/><text x="140" y="76" text-anchor="middle" font-size="30" font-weight="700" fill="#f0ece4">Replay</text><text x="140" y="112" text-anchor="middle" font-size="18" fill="#d0ccc4">complete-history walk</text><text x="140" y="147" text-anchor="middle" font-size="15" fill="#d0ccc4">rebuild from truth</text></g>
    <g transform="translate(400 680)"><rect width="280" height="190" fill="#c8c2b8" stroke="#4e4b46" stroke-width="4"/><rect width="280" height="190" fill="url(#warm-grain)"/><text x="140" y="76" text-anchor="middle" font-size="30" font-weight="700">Cache</text><text x="140" y="112" text-anchor="middle" font-size="18" fill="#4f5556">continually refreshed</text><text x="140" y="147" text-anchor="middle" font-size="15" fill="#4f5556">derived · replaceable</text></g>
    <path id="replay-to-cache" d="M320 775H400" fill="none" stroke="#292d2d" stroke-width="5" marker-end="url(#arrow)"/><text x="360" y="754" text-anchor="middle" font-size="15" fill="#292d2d">REBUILD</text><path id="cache-to-state" d="M540 870V930" fill="none" stroke="#4e4b46" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(60 940)" mask="url(#state-mask)"><rect width="600" height="420" fill="url(#state-fill)" stroke="#3c403f" stroke-width="5"/><rect width="600" height="420" fill="url(#dark-grain)" opacity=".55"/><text x="30" y="58" fill="#f4f1ea" font-size="30" font-weight="700">State</text><text x="30" y="91" fill="#ede8df" font-size="18">from derived cache</text><circle cx="300" cy="210" r="66" fill="none" stroke="#eee8dc" stroke-width="4" opacity=".78"/><path d="M116 210H234M366 210H484M300 112V144M300 276V310" stroke="#eee8dc" stroke-width="4" opacity=".78"/><path d="M234 210H366M300 144V276" stroke="#eee8dc" stroke-width="3" opacity=".65"/><text x="30" y="306" fill="#f4f1ea" font-size="18">TravelDiaryDays.Count</text><text x="30" y="338" fill="#f4f1ea" font-size="22" font-weight="700">CURRENT VIEW</text></g>
    <text x="60" y="1436" font-size="18" fill="#6f4b2e">ONE HISTORY · REPLAY REBUILDS CACHE · CACHE PRODUCES STATE</text>
  </g>
</svg>
