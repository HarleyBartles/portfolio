<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-labelledby="title desc">
  <title id="title">Wild Bunch immutable-history replay proof</title>
  <desc id="desc">A vertical immutable event history emits left into a replay spine and right into a cache fan-in. Replay and Cache both flow down into the same derived State.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="context-stroke"/></marker>
    <pattern id="warm-grain" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r="1" fill="#fff" opacity=".13"/><circle cx="13" cy="12" r="1" fill="#2b1b10" opacity=".12"/></pattern>
    <pattern id="dark-grain" width="17" height="17" patternUnits="userSpaceOnUse"><circle cx="4" cy="6" r="1" fill="#fff" opacity=".08"/><circle cx="13" cy="14" r="1.2" fill="#000" opacity=".15"/></pattern>
    <linearGradient id="state-fill" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#756a5e"/><stop offset=".58" stop-color="#91877c"/><stop offset="1" stop-color="#d9dcda"/></linearGradient>
    <linearGradient id="state-mask-gradient" x1="0" y1="0" x2="1" y2="0"><stop stop-color="white"/><stop offset=".68" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="state-mask"><rect width="600" height="300" fill="url(#state-mask-gradient)"/><g fill="black"><circle cx="492" cy="34" r="12"/><circle cx="548" cy="72" r="18"/><circle cx="506" cy="112" r="8"/><circle cx="574" cy="148" r="16"/><circle cx="522" cy="190" r="20"/><circle cx="565" cy="236" r="11"/><circle cx="510" cy="270" r="15"/></g></mask>
  </defs>
  <rect width="720" height="1280" fill="#e6eaeb"/>
  <g font-family="'Source Code Pro',Consolas,monospace" fill="#172127">
    <text x="150" y="48" font-size="22" font-weight="700" letter-spacing="1">IMMUTABLE EVENT HISTORY</text>
    <path d="M78 86V550Q78 584 112 584H70V650" fill="none" stroke="#292d2d" stroke-width="6"/>
    <g stroke="#5d3d24" stroke-width="3" fill="none">
      <path d="M150 112H80" marker-end="url(#arrow)"/><path d="M150 190H80" marker-end="url(#arrow)"/><path d="M150 268H80" marker-end="url(#arrow)"/><path d="M150 346H80" marker-end="url(#arrow)"/><path d="M150 424H80" marker-end="url(#arrow)"/><path d="M150 502H80" marker-end="url(#arrow)"/>
    </g>
    <g>
      <g transform="translate(150 80)"><rect width="410" height="64" fill="#a87243" stroke="#5d3d24" stroke-width="3"/><rect width="410" height="64" fill="url(#warm-grain)"/><text x="16" y="27" fill="#f7efe4" font-size="22" font-weight="700">EVENT 01 · TIMESTAMP</text><text x="16" y="52" fill="#f7efe4" font-size="17">GameStarted</text></g>
      <g transform="translate(150 158)"><rect width="410" height="64" fill="#9e693d" stroke="#5d3d24" stroke-width="3"/><rect width="410" height="64" fill="url(#warm-grain)"/><text x="16" y="27" fill="#f7efe4" font-size="22" font-weight="700">EVENT 02 · TIMESTAMP</text><text x="16" y="52" fill="#f7efe4" font-size="17">StoreItemPurchased</text></g>
      <g transform="translate(150 236)"><rect width="410" height="64" fill="#ad7547" stroke="#5d3d24" stroke-width="3"/><rect width="410" height="64" fill="url(#warm-grain)"/><text x="16" y="27" fill="#f7efe4" font-size="22" font-weight="700">EVENT 03 · TIMESTAMP</text><text x="16" y="52" fill="#f7efe4" font-size="17">JourneyStarted</text></g>
      <g transform="translate(150 314)"><rect width="410" height="64" fill="#986339" stroke="#5d3d24" stroke-width="3"/><rect width="410" height="64" fill="url(#warm-grain)"/><text x="16" y="27" fill="#f7efe4" font-size="22" font-weight="700">EVENT 04 · TIMESTAMP</text><text x="16" y="52" fill="#f7efe4" font-size="17">TravelDayAdvanced</text></g>
      <g transform="translate(150 392)"><rect width="410" height="64" fill="#aa7142" stroke="#5d3d24" stroke-width="3"/><rect width="410" height="64" fill="url(#warm-grain)"/><text x="16" y="27" fill="#f7efe4" font-size="22" font-weight="700">EVENT 05 · TIMESTAMP</text><text x="16" y="52" fill="#f7efe4" font-size="17">JourneyCompleted</text></g>
      <g transform="translate(150 470)"><rect width="410" height="64" fill="#956039" stroke="#5d3d24" stroke-width="3"/><rect width="410" height="64" fill="url(#warm-grain)"/><text x="16" y="27" fill="#f7efe4" font-size="22" font-weight="700">EVENT 06 · TIMESTAMP</text><text x="16" y="52" fill="#f7efe4" font-size="17">JourneyArrivalAcknowledged</text></g>
    </g>
    <g fill="none" stroke="#765432" stroke-width="3"><path d="M560 112H638" marker-end="url(#arrow)"/><path d="M560 190H638" marker-end="url(#arrow)"/><path d="M560 268H638" marker-end="url(#arrow)"/><path d="M560 346H638" marker-end="url(#arrow)"/><path d="M560 424H638" marker-end="url(#arrow)"/><path d="M560 502H638" marker-end="url(#arrow)"/><path d="M640 112V570Q640 594 616 594H550V650" marker-end="url(#arrow)"/></g>

    <g transform="translate(60 650)"><rect width="260" height="180" fill="#343738" stroke="#171b1c" stroke-width="4"/><rect width="260" height="180" fill="url(#dark-grain)"/><text x="130" y="76" text-anchor="middle" font-size="30" font-weight="700" fill="#f0ece4">Replay</text><text x="130" y="112" text-anchor="middle" font-size="18" fill="#d0ccc4">full-history walk</text><text x="130" y="145" text-anchor="middle" font-size="15" fill="#d0ccc4">rebuild from truth</text></g>
    <g transform="translate(400 650)"><rect width="260" height="180" fill="#c8c2b8" stroke="#4e4b46" stroke-width="4"/><rect width="260" height="180" fill="url(#warm-grain)"/><text x="130" y="76" text-anchor="middle" font-size="30" font-weight="700">Cache</text><text x="130" y="112" text-anchor="middle" font-size="18" fill="#4f5556">direct shortcut</text><text x="130" y="145" text-anchor="middle" font-size="15" fill="#4f5556">derived · replaceable</text></g>
    <path d="M190 830V890" fill="none" stroke="#292d2d" stroke-width="5" marker-end="url(#arrow)"/><path d="M530 830V890" fill="none" stroke="#4e4b46" stroke-width="5" marker-end="url(#arrow)"/>

    <g transform="translate(60 900)" mask="url(#state-mask)"><rect width="600" height="300" fill="url(#state-fill)" stroke="#3c403f" stroke-width="5"/><rect width="600" height="300" fill="url(#dark-grain)" opacity=".55"/><text x="30" y="58" fill="#f4f1ea" font-size="30" font-weight="700">State</text><text x="30" y="91" fill="#ede8df" font-size="18">same derived result</text><circle cx="250" cy="164" r="60" fill="none" stroke="#eee8dc" stroke-width="4" opacity=".78"/><path d="M90 164H190M310 164H410M250 86V104M250 224V242" stroke="#eee8dc" stroke-width="4" opacity=".78"/><text x="30" y="264" fill="#f4f1ea" font-size="18">TravelDiaryDays.Count = EQUAL</text></g>
    <text x="60" y="1246" font-size="18" fill="#6f4b2e">ONE HISTORY · TWO READS · ONE CURRENT STATE</text>
  </g>
</svg>
