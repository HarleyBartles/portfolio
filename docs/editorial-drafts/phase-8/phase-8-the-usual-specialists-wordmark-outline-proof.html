<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>The Usual Specialists outline fidelity proof | Phase 8</title>
  <style>
    @font-face {
      font-family: "Source Sans 3";
      src: url("./phase-8p-typography-assets/fonts/source-sans-3-latin-wght-normal.woff2") format("woff2");
      font-display: swap;
      font-style: normal;
      font-weight: 200 900;
    }
    @font-face {
      font-family: "Chassis Black Local Proof";
      src: local("Chassis Black");
      font-display: swap;
      font-style: normal;
      font-weight: 900;
    }
    :root { color-scheme: light; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; color: #111718; background: #e6eaeb; }
    * { box-sizing: border-box; }
    body { min-width: 0; margin: 0; }
    main { width: min(100% - 32px, 1240px); margin: 0 auto; padding: 48px 0 72px; }
    h1 { max-width: 16ch; margin: 0; font-size: clamp(38px, 5vw, 64px); line-height: .98; letter-spacing: -.025em; }
    .intro { display: grid; gap: 18px; margin-bottom: 42px; }
    .intro p { max-width: 70ch; margin: 0; font-size: 17px; line-height: 1.55; }
    .status { width: fit-content; padding: 8px 11px; border: 1px solid #9aa5a6; background: #fff; font-size: 14px; font-weight: 650; }
    .status[data-state="verified"] { border-color: #27755d; }
    .comparison { display: grid; gap: 24px; }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .pair--narrow { grid-template-columns: repeat(2, minmax(0, 360px)); }
    figure { margin: 0; border-top: 3px solid #a43d34; background: #f8f5ee; }
    figcaption { padding: 12px 14px; border-bottom: 1px solid #b9c0c1; font-size: 14px; font-weight: 700; }
    .stage { display: grid; min-height: 260px; place-items: center; padding: 24px; overflow: hidden; }
    .pair--narrow .stage { min-height: 180px; padding: 18px; }
    .lockup { display: block; width: 100%; height: auto; aspect-ratio: 1120 / 240; color: #111718; }
    .pair--narrow .lockup { width: min(100%, 320px); }
    .lockup__rule { fill: currentColor; }
    .lockup__the, .lockup__usual { fill: currentColor; font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; font-style: normal; font-weight: 900; }
    .lockup__the { font-size: 24px; letter-spacing: .6px; text-anchor: middle; }
    .lockup__usual { font-size: 56px; letter-spacing: -2.52px; }
    .lockup__specialists { fill: currentColor; font-family: "Chassis Black Local Proof", Impact, sans-serif; font-size: 158px; font-style: normal; font-weight: 900; letter-spacing: -2.212px; }
    .semantic-wordmark { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    @media (max-width: 760px) { main { padding-top: 32px; } .pair, .pair--narrow { grid-template-columns: 1fr; } .stage { min-height: 180px; padding: 16px; } }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false">
    <symbol id="accepted-live-wordmark" viewBox="0 0 1120 240">
      <g transform="translate(24 75) scale(1.51259) translate(-24 -75)">
        <rect class="lockup__rule" x="17.5" y="38" width="58" height="3" />
        <text class="lockup__the" x="46.5" y="65">THE</text>
        <rect class="lockup__rule" x="17.5" y="73" width="58" height="3" />
        <text class="lockup__usual" x="84" y="75">USUAL</text>
      </g>
      <text class="lockup__specialists" x="24" y="190">SPECIALISTS</text>
    </symbol>
  </svg>
  <main>
    <section class="intro">
      <h1>Accepted wordmark outline fidelity</h1>
      <p>This surface compares the frozen live-font authority with the single fully outlined SVG. It is conversion evidence only; the geometry is no longer under design review.</p>
      <div class="status" id="proof-status" data-state="checking" role="status">Checking local face and outlined asset…</div>
    </section>
    <section class="comparison" aria-label="Wide and narrow fidelity comparisons">
      <div class="pair">
        <figure>
          <figcaption>Frozen authority, wide</figcaption>
          <div class="stage"><svg id="live-wide" class="lockup" viewBox="0 0 1120 240" aria-hidden="true"><use href="#accepted-live-wordmark" /></svg><span class="semantic-wordmark">The Usual Specialists</span></div>
        </figure>
        <figure>
          <figcaption>Outlined asset, wide</figcaption>
          <div class="stage"><img id="outline-wide" class="lockup" src="./phase-8-the-usual-specialists-wordmark-assets/the-usual-specialists-wordmark.svg" alt=""><span class="semantic-wordmark">The Usual Specialists</span></div>
        </figure>
      </div>
      <div class="pair pair--narrow">
        <figure>
          <figcaption>Frozen authority, narrow</figcaption>
          <div class="stage"><svg id="live-narrow" class="lockup" viewBox="0 0 1120 240" aria-hidden="true"><use href="#accepted-live-wordmark" /></svg><span class="semantic-wordmark">The Usual Specialists</span></div>
        </figure>
        <figure>
          <figcaption>Outlined asset, narrow</figcaption>
          <div class="stage"><img id="outline-narrow" class="lockup" src="./phase-8-the-usual-specialists-wordmark-assets/the-usual-specialists-wordmark.svg" alt=""><span class="semantic-wordmark">The Usual Specialists</span></div>
        </figure>
      </div>
    </section>
  </main>
  <script>
    const status = document.querySelector('#proof-status')
    const assetUrl = './phase-8-the-usual-specialists-wordmark-assets/the-usual-specialists-wordmark.svg'
    Promise.all([
      document.fonts.load('900 158px "Chassis Black Local Proof"', 'SPECIALISTS'),
      document.fonts.load('900 56px "Source Sans 3"', 'THE USUAL'),
      fetch(assetUrl).then((response) => response.text())
    ]).then(([, , asset]) => {
      const documentNode = new DOMParser().parseFromString(asset, 'image/svg+xml')
      const root = documentNode.documentElement
      const valid = document.fonts.check('900 158px "Chassis Black Local Proof"', 'SPECIALISTS')
        && root.getAttribute('viewBox') === '0 0 1120 240'
        && root.querySelectorAll('path').length === 21
        && !root.querySelector('text, style')
      status.dataset.state = valid ? 'verified' : 'failed'
      status.textContent = valid
        ? 'Verified: one 1120 × 240 path-only asset; Chassis reference resolved locally.'
        : 'Verification failed: inspect the local font or outlined asset.'
    }).catch(() => {
      status.dataset.state = 'failed'
      status.textContent = 'Verification failed: inspect the local font or outlined asset.'
    })
  </script>
</body>
</html>
