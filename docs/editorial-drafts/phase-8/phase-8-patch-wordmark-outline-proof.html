<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phase 8 — PATCH outline fidelity proof</title>
  <style>
    @font-face {
      font-family: "PATCH fidelity reference";
      src: local("SerifGothicStd-Black"), local("ITC Serif Gothic Std Black"), local("ITC Serif Gothic Std");
      font-style: normal;
      font-weight: 900;
    }
    :root { --reference-em: clamp(42px, 8vw, 100px); color-scheme: dark; font-family: "Source Sans 3", system-ui, sans-serif; background: #081112; color: #f5ecd7; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(24px, 5vw, 72px); }
    main { width: min(1120px, 100%); margin: 0 auto; }
    h1 { margin: 0 0 12px; font-size: clamp(22px, 3vw, 36px); }
    p { max-width: 68ch; margin: 0 0 36px; color: #b9c4c3; line-height: 1.55; }
    .comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    figure { margin: 0; padding: clamp(18px, 3vw, 34px); border: 1px solid rgb(245 236 215 / 24%); background: #0e1c1d; }
    figcaption { margin-bottom: 22px; color: #b9c4c3; font-size: 14px; }
    .live-reference, .outline-reference { display: block; color: #f5ecd7; }
    .live-reference, .fallback-control { width: max-content; font-size: var(--reference-em); font-style: normal; font-weight: 900; line-height: .744; white-space: nowrap; }
    .live-reference { font-family: "PATCH fidelity reference", sans-serif; }
    .fallback-control { position: absolute; visibility: hidden; font-family: Arial, sans-serif; }
    .outline-reference { width: min(100%, calc(var(--reference-em) * 2.893)); }
    .outline-reference { height: auto; }
    .narrow { width: min(320px, 100%); margin-top: 24px; }
    .semantic-wordmark { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    @media (max-width: 680px) { .comparison { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>PATCH outline fidelity proof</h1>
    <p>This deterministic surface compares the locally installed upright Black face with the static five-path export. It verifies conversion fidelity; it is not a design comparison.</p>
    <section class="comparison" aria-label="Wide comparison">
      <figure>
        <figcaption>Installed-font reference</figcaption>
        <span class="live-reference">PATCH</span>
        <span class="fallback-control" aria-hidden="true">PATCH</span>
      </figure>
      <figure>
        <figcaption>Static outline asset</figcaption>
        <span class="semantic-wordmark">PATCH</span>
        <svg class="outline-reference" viewBox="0 0 2893 744" preserveAspectRatio="xMinYMin meet" aria-hidden="true" focusable="false"><use href="./phase-8-patch-wordmark-assets/patch-wordmark.svg#patch-wordmark" /></svg>
      </figure>
    </section>
    <figure class="narrow">
      <figcaption>Outlined asset at narrow marque scale</figcaption>
      <span class="semantic-wordmark">PATCH</span>
      <svg class="outline-reference" viewBox="0 0 2893 744" preserveAspectRatio="xMinYMin meet" aria-hidden="true" focusable="false"><use href="./phase-8-patch-wordmark-assets/patch-wordmark.svg#patch-wordmark" /></svg>
    </figure>
  </main>
</body>
</html>
