name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  quality:
    name: Portfolio quality gate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix src/client

      - name: Install Chromium
        run: npx --prefix src/client playwright install --with-deps chromium

      - name: Run canonical quality gate
        run: python3 tools/run.py ci --check --verbose

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/client/playwright-report
          if-no-files-found: ignore
          retention-days: 14
